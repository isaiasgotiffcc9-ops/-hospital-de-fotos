<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hospital de Fotos Monterrey</title><style>body{background:#000;color:#fff;font-family:system-ui;text-align:center;padding:15px}h1{color:#FFD700;font-size:28px}.btn{background:#FFD700;color:#000;padding:14px 28px;border-radius:50px;font-weight:900;text-decoration:none;display:inline-block;margin:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:1000px;margin:20px auto}.card{background:#151515;border-radius:12px;border:1px solid #222;overflow:hidden}.card img{width:100%;height:200px;object-fit:cover}.card div{padding:10px}.auto{background:#111;border:1px dashed #FFD700;padding:14px;border-radius:10px;margin:15px auto;max-width:600px}</style></head><body><h1>Hospital de Fotos Monterrey</h1><p>Laboratorio de Memoria - Monterrey, NL - 500+ fotos desde 2020</p><a class="btn" href="https://m.me/HospitalDeFotos">COTIZAR MESSENGER</a><a class="btn" style="background:#fff" href="https://wa.me/528112345678">WHATSAPP</a><div class="auto">🧠 MODO AUTOMATICO<br>Sube fotos a carpeta <b>casos-reales/</b> y aparecen solas aqui</div><div class="grid" id="grid"></div><script>const U="isaiasgotiffcc9-ops",R="-hospital-de-fotos",F="casos-reales";async function load(){const g=document.getElementById('grid');try{const r=await fetch(`https://api.github.com/repos/${U}/${R}/contents/${F}`);if(!r.ok)throw 0;const j=await r.json();const f=j.filter(x=>x.name.match(/\.(jpg|png|jpeg|webp)$/i));if(!f.length){g.innerHTML="<div class=card><div><h3>Carpeta lista</h3><p>Sube fotos a casos-reales/</p></div></div>";return}g.innerHTML=f.map((x,i)=>`<div class=card><img src="${x.download_url}"><div>Caso ${i+1}<br>${x.name}</div></div>`).join('')}catch(e){g.innerHTML="<div class=card><div><h3>Automatico listo</h3><p>Crea carpeta casos-reales y sube fotos</p></div></div>"}}load();</script></body></html>
